# Per-agent model + sampling config for pagespeak's LLM-calling tasks.
#
# Read by pw-core's model router (`pw_core.llm.router`); pagespeak's
# `_agent_runtime` seam points the router here (the copy bundled in the
# wheel is the fallback). Nested schema — each task declares a model per
# backend:
#
#   agents:
#     <agent_slug>:
#       backends:
#         claude_code:
#           model: <claude-code-flavored model name>
#         anthropic:
#           model: <anthropic-API model name>
#         openrouter:
#           model: <openrouter slash-namespaced model name>
#       # Optional shared sampling kwargs (apply to whichever backend
#       # is picked):
#       # temperature: 0.0
#       # max_tokens: 4000
#
# Backend precedence: per-call `backend=` kwarg > `PAGESPEAK_<SLUG>_BACKEND`
# env var (enabled by `env_prefix`) > top-level `default_client`. An env
# value naming an undeclared backend falls through to the default.
#
# Model precedence: per-call override (`to_markdown(vision_model=…)` /
# CLI `--<task>-model`) > the active backend's `model` entry.
#
# `non_chat_keys` names YAML keys that are pagespeak-side options, not
# client.chat() kwargs — the router strips them from resolved configs;
# read them via `pagespeak._agent_runtime.agent_option`.
#
# Override the YAML path with `MODEL_ROUTER_CONFIG=path/to/file.yaml`.
# Edits hot-reload within MODEL_ROUTER_RELOAD_SECONDS (default 60).

env_prefix: PAGESPEAK
default_client: claude_code
non_chat_keys: [max_input_tokens]

agents:
  vision:
    # Vision pass — per-image diagram classification + caption + mermaid.
    # Native multimodal required.
    backends:
      claude_code:
        # `haiku` short alias resolves to whatever the local Claude CLI
        # session has access to (typically the latest pinned Haiku).
        model: haiku
        # claude --print uses session-default max output; no kwarg needed.
      anthropic:
        model: claude-haiku-5-5
        # Thinking is on by default and counts against max_tokens.
        max_tokens: 8000
        # Haiku 5.5 rejects non-default sampling values; null makes
        # pw-core omit them from the API body.
        temperature: null
        top_p: null
      openrouter:
        model: google/gemini-3.8-flash
        max_tokens: 2048

  heading_normalize:
    # `llm` mode — filtered structural-heading list (numbered prefixes
    # only). Tiny payload, haiku is plenty.
    #
    # One `<idx>: <level>` line per heading, so the output budget scales
    # with heading count (a large textbook ≈ 1750 headings ≈ 4400 tokens).
    # 8000 leaves headroom; claude_code ignores this kwarg.
    backends:
      claude_code:
        # `haiku` short alias — resolved by the local CLI to the latest
        # Haiku your session has access to.
        model: sonnet
      anthropic:
        model: claude-sonnet-5-5
        max_tokens: 16000
        temperature: null
        top_p: null
      openrouter:
        model: google/gemini-3.8-flash
        max_tokens: 8000

  heading_normalize_dehead:
    # `llm_dehead` mode — same headings + body-context payload as
    # `heading_normalize_full`, but the model is asked only whether each
    # heading is real (KEEP/DROP); levels are never reassigned. For a
    # document whose hierarchy the extractor already got right (an
    # embedded outline or a section-numbering spine), re-leveling is both
    # unnecessary and a regression risk — junk removal is the only thing
    # no deterministic pass can do.
    backends:
      claude_code:
        model: opus
        max_input_tokens: 900000
      anthropic:
        model: claude-opus-5-5
        max_tokens: 16000
        max_input_tokens: 150000
        temperature: null
        top_p: null
      openrouter:
        model: anthropic/claude-opus-5.5
        max_tokens: 16000
        max_input_tokens: 900000

  heading_normalize_full:
    # `llm_full` mode — all headings + body-context anchors. The
    # reasoning-heavy task: inferring parent-child relationships from prose
    # when headings are unnumbered. Sonnet fits Anthropic-family backends;
    # Haiku struggles on the tricky unnumbered-heading cases.
    #
    # `max_input_tokens` is pagespeak's payload-shaping gate (NOT a client
    # kwarg). When chars÷4 of the headings+anchors prompt exceeds it, gather
    # drops body anchors and re-sends headings only. Set per-backend to
    # match each backend's context window. `max_tokens` is the output cap.
    backends:
      claude_code:
        # `opus` short alias — resolves to whatever Opus the local CLI
        # session has access to. Best reasoning available, $0 under an
        # active Max subscription. Swap to `sonnet` for faster/cheaper.
        model: opus
        # Opus via the CLI has a 1M context. 900K leaves ~100K for the
        # one-line-per-heading reply; below this the payload falls back to
        # headings-only, dropping the body anchors the prompt judges by.
        # Drop to 150K to force that fallback.
        max_input_tokens: 900000
      anthropic:
        # Direct Anthropic API. Current models reject `temperature` and
        # `top_p` — null makes pw-core omit them. Thinking is always on
        # and counts against max_tokens.
        model: claude-opus-5-5
        #model: claude-sonnet-5-5
        max_tokens: 16000
        max_input_tokens: 150000
        temperature: null
        top_p: null
      openrouter:
        # 1M window — keeps body anchors through for textbook-scale docs
        # without the gate firing.
        model: anthropic/claude-opus-5.5
        max_tokens: 16000
        max_input_tokens: 900000
